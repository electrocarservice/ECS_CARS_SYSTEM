<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVBase — Главная и Новости</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>⚡ EVBase</h1>
            <span class="status-badge">
                <span class="status-dot"></span> 
                <span class="status-text">Drive: Загрузка...</span>
            </span>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-home active">🏠 Домой</a>
            <a href="cars.html">Каталог авто</a>
            <a href="tasks.html">Задачи и ТО</a>
            <a href="add.html">Добавить</a>
        </nav>
    </header>

    <main class="container">
        <!-- Поиск по базе -->
        <section class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по базе знаний EVBase..." />
        </section>

        <!-- Результаты глобального поиска (если пользователь вводит текст) -->
        <section id="searchResultsBlock" class="hidden"></section>

        <!-- Блок Новостей -->
        <section id="newsSection" class="news-section">
            <div class="section-header">
                <h2>⚡ Новости из мира электромобилей</h2>
                <button id="refreshNewsBtn" class="btn-refresh">🔄 Обновить</button>
            </div>
            
            <div id="newsContainer" class="news-container">
                <div class="loading-spinner">Загрузка последних новостей...</div>
            </div>
        </section>
    </main>

    <!-- ИИ-Ассистент -->
    <button id="toggleChatBtn" class="chat-toggle-btn">💬</button>
    <div id="chatWindow" class="chat-window hidden">
        <div class="chat-header">
            <h3>ИИ-Ассистент EVBase</h3>
            <button id="closeChat" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem; margin-left:auto;">&times;</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Задать вопрос...">
            <button id="sendMessageBtn">➔</button>
        </div>
    </div>

    <script src="js/drive.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/news.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
